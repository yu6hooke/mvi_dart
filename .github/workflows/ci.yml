name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minimum: the lower bound declared in packages/mvi_dart/pubspec.yaml
        # pinned: the development version in .tool-versions
        flutter: [minimum, pinned]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Resolve Flutter version
        id: flutter-version
        env:
          TARGET: ${{ matrix.flutter }}
        run: |
          case "$TARGET" in
            minimum) version=$(sed -n 's/^  flutter: ">=\(.*\)"$/\1/p' packages/mvi_dart/pubspec.yaml) ;;
            pinned) version=$(grep flutter .tool-versions | cut -d' ' -f2 | sed 's/-stable//') ;;
          esac
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: |
          for d in packages/mvi_dart_test packages/mvi_dart example; do
            (cd $d && flutter pub get)
          done

      # page_width lives in each package's analysis_options, which needs resolved dependencies.
      # Formatter output can change between Dart versions, so only the pinned version checks it.
      - name: Check formatting
        if: matrix.flutter == 'pinned'
        run: dart format --set-exit-if-changed $(git ls-files '*.dart')

      - name: mvi_dart_test
        working-directory: packages/mvi_dart_test
        run: flutter analyze

      - name: mvi_dart
        working-directory: packages/mvi_dart
        run: flutter analyze && flutter test

      - name: example
        working-directory: example
        run: dart run build_runner build && flutter analyze && flutter test
